spring.application.name=demo

spring.datasource.url=jdbc:postgresql://localhost:5432/masterprep_db
spring.datasource.username=postgres
spring.datasource.password=postgres

# Настройки JPA / Hibernate
# validate проверяет, соответствуют ли Java Entity таблицам в БД, созданным через Flyway
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true

# Настройки Flyway
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
logging.level.org.flywaydb=DEBUG
logging.level.org.springframework.boot.autoconfigure.flyway=DEBUG